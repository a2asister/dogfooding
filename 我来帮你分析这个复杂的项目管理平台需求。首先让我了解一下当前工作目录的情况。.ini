## 技术实现总结

### 前端技术栈
- **React 19** + **TypeScript** - 核心框架
- **Vite 8.x** - 构建工具
- **Ant Design 5.x** - UI 组件库
- **React Router v6** - 路由管理
- **Zustand** - 轻量级状态管理
- **Dexie.js** - IndexDB 封装
- **@dnd-kit** - 拖拽功能
- **Recharts** - 图表可视化

### 项目结构
```
src/
├── types/          # 26+ 类型定义
├── db/             # IndexDB 数据库层
├── stores/         # 5 个 Zustand Store
├── components/     # UI 组件
├── pages/          # 页面组件
├── router/         # 路由配置
└── utils/          # 工具函数
```

### 核心功能模块
1. **事项管理** - 需求、用户故事、开发任务、测试用例、线上缺陷、风险问题、史诗
2. **自定义字段** - 单选、多选、文本、日期、人员、版本、模块等
3. **工作流引擎** - 状态流转、审批节点、条件分支
4. **多视图展示** - 敏捷看板、列表、待办事项
5. **项目规划** - 迭代冲刺、版本发布、业务模块、标签分类
6. **协作功能** - 任务指派、评论、操作日志、工时填报
7. **权限管理** - 项目级角色权限、数据隔离
8. **数据报表** - 仪表盘、燃尽图、数据可视化

### 数据存储
- **IndexDB** - 本地数据库存储
- **Dexie.js** - 优雅的 IndexDB 封装
- **模拟数据** - 首次运行自动生成演示数据

