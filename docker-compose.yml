version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: grand_canal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: grand_canal_monitoring
      MYSQL_USER: canal_user
      MYSQL_PASSWORD: canal_pass123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - grand_canal_network

volumes:
  mysql_data:
    driver: local

networks:
  grand_canal_network:
    driver: bridge
