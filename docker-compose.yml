version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: game_gift_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: game_gift_center
      MYSQL_USER: game_admin
      MYSQL_PASSWORD: game123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - game_gift_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: game_gift_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - game_gift_network

volumes:
  mysql_data:

networks:
  game_gift_network:
    driver: bridge
