<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>多重人格测试</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 欢迎页面 -->
        <div id="welcome-page" class="page active">
            <div class="card">
                <h1 class="title">🧠 多重人格测试</h1>
                <p class="subtitle">探索你内心深处的多重人格</p>
                <div class="description">
                    <p>每个人的内心都住着不同的自己</p>
                    <p>通过这个测试，发现你的多重人格特质</p>
                    <p class="warning">⚠️ 仅供娱乐，非专业诊断</p>
                </div>
                <button class="btn btn-primary" id="start-btn">开始测试</button>
            </div>
        </div>

        <!-- 问题页面 -->
        <div id="question-page" class="page">
            <div class="card">
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="question-number">问题 <span id="current-question">1</span>/<span id="total-questions">10</span></div>
                <h2 class="question" id="question-text"></h2>
                <div class="options" id="options-container"></div>
            </div>
        </div>

        <!-- 结果页面 -->
        <div id="result-page" class="page">
            <div class="card">
                <h2 class="result-title">你的测试结果</h2>
                <div class="result-card">
                    <div class="personality-icon" id="personality-icon">🎭</div>
                    <h3 class="personality-type" id="personality-type"></h3>
                    <p class="personality-desc" id="personality-desc"></p>
                </div>
                <div class="traits-container">
                    <h4>人格特质分析</h4>
                    <div class="traits" id="traits-container"></div>
                </div>
                <div class="result-actions">
                    <button class="btn btn-secondary" id="restart-btn">重新测试</button>
                    <button class="btn btn-primary" id="share-btn">分享结果</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
