<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地震场景动态模拟系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部工具栏 -->
        <header class="toolbar">
            <h1 class="title">地震场景动态模拟系统</h1>
            <div class="toolbar-controls">
                <button id="fullscreenBtn" class="tool-btn" title="全屏">
                    <svg viewBox="0 0 24 24" class="icon">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                    </svg>
                </button>
                <button id="helpBtn" class="tool-btn" title="帮助">
                    <svg viewBox="0 0 24 24" class="icon">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 左侧模拟区域 -->
            <section class="simulation-area">
                <canvas id="simulationCanvas"></canvas>
                
                <!-- 控制栏 -->
                <div class="control-bar">
                    <div class="playback-controls">
                        <button id="playBtn" class="control-btn primary" title="播放">
                            <svg viewBox="0 0 24 24" class="icon">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            <span>播放</span>
                        </button>
                        <button id="pauseBtn" class="control-btn" title="暂停">
                            <svg viewBox="0 0 24 24" class="icon">
                                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                            </svg>
                            <span>暂停</span>
                        </button>
                        <button id="resetBtn" class="control-btn" title="重置">
                            <svg viewBox="0 0 24 24" class="icon">
                                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                            </svg>
                            <span>重置</span>
                        </button>
                    </div>

                    <div class="parameter-controls">
                        <!-- 震级调节 -->
                        <div class="control-group">
                            <label>震级</label>
                            <input type="range" id="magnitudeSlider" min="1" max="9" step="0.1" value="5">
                            <span class="value-display" id="magnitudeValue">5.0</span>
                        </div>

                        <!-- 震源深度调节 -->
                        <div class="control-group">
                            <label>震源深度 (km)</label>
                            <input type="range" id="depthSlider" min="0" max="700" step="1" value="30">
                            <span class="value-display" id="depthValue">30</span>
                        </div>

                        <!-- 地形选择 -->
                        <div class="control-group">
                            <label>地形场景</label>
                            <select id="terrainSelect" class="select-control">
                                <option value="plain">平原</option>
                                <option value="mountain">山地</option>
                                <option value="city">城市</option>
                            </select>
                        </div>

                        <!-- 恢复默认 -->
                        <button id="resetDefaultsBtn" class="control-btn secondary" title="恢复默认">
                            恢复默认
                        </button>
                    </div>
                </div>
            </section>

            <!-- 右侧数据面板 -->
            <aside class="data-panel">
                <div class="panel-section">
                    <h3>实时数据</h3>
                    <div class="data-grid">
                        <div class="data-item">
                            <span class="label">震级</span>
                            <span class="value" id="dataMagnitude">5.0</span>
                            <span class="unit">级</span>
                        </div>
                        <div class="data-item">
                            <span class="label">震源深度</span>
                            <span class="value" id="dataDepth">30</span>
                            <span class="unit">km</span>
                        </div>
                        <div class="data-item">
                            <span class="label">地震类型</span>
                            <span class="value" id="earthquakeType">浅源地震</span>
                        </div>
                        <div class="data-item">
                            <span class="label">当前状态</span>
                            <span class="value" id="currentStatus">待机</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>关键位置</h3>
                    <div class="location-info">
                        <div class="location-item">
                            <span class="dot epicenter"></span>
                            <span class="label">震中</span>
                        </div>
                        <div class="location-item">
                            <span class="dot hypocenter"></span>
                            <span class="label">震源</span>
                        </div>
                        <div class="location-item">
                            <span class="line isoseismal"></span>
                            <span class="label">等震线</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>破坏程度</h3>
                    <div class="damage-info" id="damageInfo">
                        <p>5.0级地震：中等强度地震，可能造成轻微破坏</p>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>科普说明</h3>
                    <div class="education-buttons">
                        <button class="education-btn" data-type="basic">地震基础</button>
                        <button class="education-btn" data-type="indoor">室内避险</button>
                        <button class="education-btn" data-type="outdoor">室外避险</button>
                    </div>
                </div>

                <div class="panel-section performance-info">
                    <h3>性能指标</h3>
                    <div class="data-grid">
                        <div class="data-item">
                            <span class="label">帧率</span>
                            <span class="value" id="fpsValue">60</span>
                            <span class="unit">FPS</span>
                        </div>
                        <div class="data-item">
                            <span class="label">内存占用</span>
                            <span class="value" id="memoryValue">~100</span>
                            <span class="unit">MB</span>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- 科普弹窗 -->
    <div id="educationModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">地震基础概念</h3>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body" id="modalContent">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
