<div class="flex h-screen bg-gray-50">
  <aside class="bg-gradient-to-b from-primary-700 to-primary-900 text-white transition-all duration-300 flex flex-col w-64">
    <div class="p-4 flex items-center justify-between border-b border-primary-600">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center text-xl">
          🏢
        </div>
        <span class="font-bold text-lg">CRM系统</span>
      </div>
    </div>
    
    <nav class="flex-1 p-4">
      <ul class="space-y-2">
        <li *ngFor="let item of navItems">
          <a 
            [routerLink]="item.path"
            class="flex items-center space-x-3 px-3 py-3 rounded-lg transition-colors"
            [ngClass]="{'bg-white bg-opacity-20': isActive(item.path)}"
          >
            <span class="text-xl">{{ item.icon }}</span>
            <span class="text-sm font-medium">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </nav>
    
    <div class="p-4 border-t border-primary-600">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
          👤
        </div>
        <div>
          <p class="text-sm font-medium">管理员</p>
          <p class="text-xs text-white text-opacity-70">admin at company.com</p>
        </div>
      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-semibold text-gray-800">{{ title }}</h1>
        <div class="flex items-center space-x-4">
          <button class="relative p-2 text-gray-500 hover:text-gray-700">
            🔔
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <div class="flex items-center space-x-2 text-sm text-gray-600">
            <span>📅</span>
            <span>{{ currentDate }}</span>
          </div>
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-auto p-6">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
