<div class="checkin-overlay" *ngIf="visible">
  <div class="checkin-content" [@bounceIn]="'visible'">
    <div class="checkin-icon">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="45" fill="url(#checkGradient)" class="pulse-ring"/>
        <path 
          d="M30 50 L45 65 L70 35" 
          fill="none" 
          stroke="white" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          class="check-mark"
        />
      </svg>
    </div>
    <h2 class="checkin-title">恭喜完成！</h2>
    <p class="checkin-message">今天的训练已打卡 🎉</p>
    <div class="confetti">
      <span *ngFor="let i of [1,2,3,4,5,6,7,8]" class="confetti-piece" [style.--i]="i">
        🎊
      </span>
    </div>
  </div>
</div>
