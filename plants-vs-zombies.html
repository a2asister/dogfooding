<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物大战僵尸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-title {
            color: #fff;
            font-size: 2.5rem;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #f0f8ff;
            border-radius: 10px;
        }

        .sun-display {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff9800;
        }

        .sun-icon {
            width: 35px;
            height: 35px;
            background: radial-gradient(circle, #ffeb3b, #ff9800);
            border-radius: 50%;
            box-shadow: 0 0 10px #ffeb3b;
        }

        .game-info {
            display: flex;
            gap: 20px;
            font-size: 1rem;
        }

        .info-item {
            padding: 5px 15px;
            background: #e3f2fd;
            border-radius: 20px;
            color: #1565c0;
        }

        .plant-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .plant-card {
            padding: 10px 15px;
            background: #fff;
            border: 2px solid #4caf50;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .plant-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .plant-card.selected {
            background: #4caf50;
            color: #fff;
            border-color: #2e7d32;
        }

        .plant-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .plant-cost {
            font-weight: bold;
            color: #ff9800;
        }

        .plant-card.selected .plant-cost {
            color: #ffeb3b;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(9, 80px);
            grid-template-rows: repeat(5, 80px);
            gap: 2px;
            background: #8bc34a;
            padding: 5px;
            border-radius: 10px;
            position: relative;
        }

        .cell {
            background: #a5d6a7;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover {
            background: #81c784;
        }

        .cell.occupied {
            cursor: default;
        }

        .plant {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #66bb6a, #43a047);
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .plant::before {
            content: '🌱';
            font-size: 2rem;
        }

        .zombie {
            position: absolute;
            width: 50px;
            height: 60px;
            background: #795548;
            border-radius: 10px 10px 5px 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: left 0.1s linear;
        }

        .zombie::before {
            content: '🧟';
            font-size: 1.8rem;
        }

        .bullet {
            position: absolute;
            width: 15px;
            height: 15px;
            background: radial-gradient(circle, #4caf50, #2e7d32);
            border-radius: 50%;
            box-shadow: 0 0 10px #4caf50;
            z-index: 15;
            transition: left 0.05s linear;
        }

        .sun-drop {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #ffeb3b, #ff9800);
            border-radius: 50%;
            box-shadow: 0 0 15px #ffeb3b;
            cursor: pointer;
            z-index: 30;
            animation: float 2s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .sun-drop:hover {
            transform: scale(1.2);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(244, 67, 54, 0.95);
            color: #fff;
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .game-over h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .game-over p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .restart-btn {
            padding: 10px 30px;
            font-size: 1.1rem;
            background: #fff;
            color: #f44336;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .control-btn {
            padding: 10px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .start-btn {
            background: #4caf50;
            color: #fff;
        }

        .start-btn:hover {
            background: #388e3c;
            transform: scale(1.05);
        }

        .pause-btn {
            background: #ff9800;
            color: #fff;
        }

        .pause-btn:hover {
            background: #f57c00;
            transform: scale(1.05);
        }

        .row-indicator {
            position: absolute;
            left: -30px;
            width: 25px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .damage-flash {
            animation: damageFlash 0.1s ease-in-out;
        }

        @keyframes damageFlash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5) hue-rotate(30deg); }
        }
    </style>
</head>
<body>
    <h1 class="game-title">🌻 植物大战僵尸 🧟</h1>
    
    <div class="game-container">
        <div class="top-bar">
            <div class="sun-display">
                <div class="sun-icon"></div>
                <span id="sun-count">50</span>
            </div>
            <div class="game-info">
                <div class="info-item">波次: <span id="wave-count">1</span></div>
                <div class="info-item">击杀: <span id="kill-count">0</span></div>
            </div>
        </div>

        <div class="plant-selector">
            <div class="plant-card selected" data-plant="peashooter" data-cost="100">
                <span>🌱</span>
                <span>豌豆射手</span>
                <span class="plant-cost">100☀</span>
            </div>
            <div class="plant-card" data-plant="sunflower" data-cost="50">
                <span>🌻</span>
                <span>向日葵</span>
                <span class="plant-cost">50☀</span>
            </div>
            <div class="plant-card" data-plant="wallnut" data-cost="50">
                <span>🌰</span>
                <span>坚果墙</span>
                <span class="plant-cost">50☀</span>
            </div>
        </div>

        <div class="game-board" id="game-board">
            <div class="row-indicator" style="top: 5px;">行1</div>
            <div class="row-indicator" style="top: 87px;">行2</div>
            <div class="row-indicator" style="top: 169px;">行3</div>
            <div class="row-indicator" style="top: 251px;">行4</div>
            <div class="row-indicator" style="top: 333px;">行5</div>
        </div>

        <div class="controls">
            <button class="control-btn start-btn" id="start-btn">开始游戏</button>
            <button class="control-btn pause-btn" id="pause-btn" style="display: none;">暂停</button>
        </div>

        <div class="game-over" id="game-over" style="display: none;">
            <h2>游戏结束！</h2>
            <p>僵尸入侵了你的花园...</p>
            <p>最终波次: <span id="final-wave">1</span></p>
            <p>击杀数量: <span id="final-kills">0</span></p>
            <button class="restart-btn" id="restart-btn">重新开始</button>
        </div>
    </div>

    <script>
        // 游戏配置
        const CONFIG = {
            rows: 5,
            cols: 9,
            cellWidth: 80,
            cellHeight: 80,
            initialSun: 50,
            sunDropInterval: 8000,
            sunValue: 25,
            zombieSpawnInterval: 10000,
            zombieSpeed: 0.5,
            plantShootInterval: 1500,
            bulletSpeed: 5,
            bulletDamage: 20,
            sunflowerSunInterval: 5000,
        };

        // 植物类型配置
        const PLANTS = {
            peashooter: {
                cost: 100,
                health: 100,
                emoji: '🌱',
                canShoot: true,
                isSunflower: false,
                isWallnut: false
            },
            sunflower: {
                cost: 50,
                health: 80,
                emoji: '🌻',
                canShoot: false,
                isSunflower: true,
                isWallnut: false
            },
            wallnut: {
                cost: 50,
                health: 400,
                emoji: '🌰',
                canShoot: false,
                isSunflower: false,
                isWallnut: true
            }
        };

        // 游戏状态
        let gameState = {
            isRunning: false,
            isPaused: false,
            sunCount: CONFIG.initialSun,
            wave: 1,
            kills: 0,
            selectedPlant: 'peashooter',
            plants: [],
            zombies: [],
            bullets: [],
            sunDrops: [],
            intervals: [],
            animationFrameId: null
        };

        // DOM元素
        const gameBoard = document.getElementById('game-board');
        const sunCountElement = document.getElementById('sun-count');
        const waveCountElement = document.getElementById('wave-count');
        const killCountElement = document.getElementById('kill-count');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const gameOverElement = document.getElementById('game-over');
        const finalWaveElement = document.getElementById('final-wave');
        const finalKillsElement = document.getElementById('final-kills');
        const restartBtn = document.getElementById('restart-btn');
        const plantCards = document.querySelectorAll('.plant-card');

        // 初始化游戏板
        function initializeBoard() {
            gameBoard.innerHTML = `
                <div class="row-indicator" style="top: 5px;">行1</div>
                <div class="row-indicator" style="top: 87px;">行2</div>
                <div class="row-indicator" style="top: 169px;">行3</div>
                <div class="row-indicator" style="top: 251px;">行4</div>
                <div class="row-indicator" style="top: 333px;">行5</div>
            `;
            
            for (let row = 0; row < CONFIG.rows; row++) {
                for (let col = 0; col < CONFIG.cols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.style.gridRow = row + 1;
                    cell.style.gridColumn = col + 1;
                    
                    cell.addEventListener('click', () => handleCellClick(row, col, cell));
                    gameBoard.appendChild(cell);
                }
            }
        }

        // 更新UI
        function updateUI() {
            sunCountElement.textContent = gameState.sunCount;
            waveCountElement.textContent = gameState.wave;
            killCountElement.textContent = gameState.kills;
            
            plantCards.forEach(card => {
                const cost = parseInt(card.dataset.cost);
                if (gameState.sunCount < cost) {
                    card.classList.add('disabled');
                } else {
                    card.classList.remove('disabled');
                }
            });
        }

        // 处理植物选择
        plantCards.forEach(card => {
            card.addEventListener('click', () => {
                if (card.classList.contains('disabled')) return;
                
                plantCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                gameState.selectedPlant = card.dataset.plant;
            });
        });

        // 处理格子点击
        function handleCellClick(row, col, cell) {
            if (!gameState.isRunning || gameState.isPaused) return;
            if (cell.classList.contains('occupied')) return;
            
            const plantType = gameState.selectedPlant;
            const plantConfig = PLANTS[plantType];
            
            if (gameState.sunCount < plantConfig.cost) return;
            
            gameState.sunCount -= plantConfig.cost;
            cell.classList.add('occupied');
            
            const plant = {
                id: Date.now(),
                type: plantType,
                row,
                col,
                x: col * CONFIG.cellWidth + 5 + 10,
                y: row * CONFIG.cellHeight + 5 + 10,
                health: plantConfig.health,
                maxHealth: plantConfig.health,
                element: null,
                lastShootTime: 0,
                lastSunTime: 0
            };
            
            const plantElement = document.createElement('div');
            plantElement.className = 'plant';
            plantElement.style.left = plant.x + 'px';
            plantElement.style.top = plant.y + 'px';
            plantElement.innerHTML = plantConfig.emoji;
            plantElement.style.fontSize = '2rem';
            plantElement.style.background = 'transparent';
            plantElement.style.boxShadow = 'none';
            plantElement.dataset.plantId = plant.id;
            
            plant.element = plantElement;
            gameBoard.appendChild(plantElement);
            gameState.plants.push(plant);
            
            updateUI();
        }

        // 生成阳光
        function spawnSunDrop() {
            if (!gameState.isRunning || gameState.isPaused) return;
            
            const col = Math.floor(Math.random() * CONFIG.cols);
            const x = col * CONFIG.cellWidth + 5 + 25;
            const startY = -30;
            const endY = Math.random() * (CONFIG.rows * CONFIG.cellHeight - 30);
            
            const sunDrop = {
                id: Date.now() + Math.random(),
                x,
                y: startY,
                targetY: endY,
                element: null
            };
            
            const sunElement = document.createElement('div');
            sunElement.className = 'sun-drop';
            sunElement.style.left = x + 'px';
            sunElement.style.top = startY + 'px';
            sunElement.dataset.sunId = sunDrop.id;
            
            sunElement.addEventListener('click', (e) => {
                e.stopPropagation();
                collectSun(sunDrop);
            });
            
            sunDrop.element = sunElement;
            gameBoard.appendChild(sunElement);
            gameState.sunDrops.push(sunDrop);
            
            const fallInterval = setInterval(() => {
                if (!gameState.isRunning) {
                    clearInterval(fallInterval);
                    return;
                }
                if (gameState.isPaused) return;
                
                sunDrop.y += 2;
                sunDrop.element.style.top = sunDrop.y + 'px';
                
                if (sunDrop.y >= sunDrop.targetY) {
                    clearInterval(fallInterval);
                    
                    setTimeout(() => {
                        if (gameState.sunDrops.includes(sunDrop)) {
                            removeSunDrop(sunDrop);
                        }
                    }, 5000);
                }
            }, 30);
        }

        // 收集阳光
        function collectSun(sunDrop) {
            gameState.sunCount += CONFIG.sunValue;
            removeSunDrop(sunDrop);
            updateUI();
        }

        // 移除阳光
        function removeSunDrop(sunDrop) {
            const index = gameState.sunDrops.indexOf(sunDrop);
            if (index > -1) {
                gameState.sunDrops.splice(index, 1);
                if (sunDrop.element && sunDrop.element.parentNode) {
                    sunDrop.element.remove();
                }
            }
        }

        // 向日葵产生阳光
        function sunflowerProduceSun(plant) {
            if (!gameState.isRunning || gameState.isPaused) return;
            if (!PLANTS[plant.type].isSunflower) return;
            
            const now = Date.now();
            if (now - plant.lastSunTime < CONFIG.sunflowerSunInterval) return;
            
            plant.lastSunTime = now;
            
            const sunDrop = {
                id: Date.now() + Math.random(),
                x: plant.x + 15,
                y: plant.y + 15,
                targetY: plant.y + 15,
                element: null
            };
            
            const sunElement = document.createElement('div');
            sunElement.className = 'sun-drop';
            sunElement.style.left = sunDrop.x + 'px';
            sunElement.style.top = sunDrop.y + 'px';
            sunElement.dataset.sunId = sunDrop.id;
            
            sunElement.addEventListener('click', (e) => {
                e.stopPropagation();
                collectSun(sunDrop);
            });
            
            sunDrop.element = sunElement;
            gameBoard.appendChild(sunElement);
            gameState.sunDrops.push(sunDrop);
            
            setTimeout(() => {
                if (gameState.sunDrops.includes(sunDrop)) {
                    removeSunDrop(sunDrop);
                }
            }, 5000);
        }

        // 生成僵尸
        function spawnZombie() {
            if (!gameState.isRunning || gameState.isPaused) return;
            
            const row = Math.floor(Math.random() * CONFIG.rows);
            const x = CONFIG.cols * CONFIG.cellWidth + 5;
            
            const zombie = {
                id: Date.now() + Math.random(),
                row,
                x,
                y: row * CONFIG.cellHeight + 5 + 10,
                health: 100 + gameState.wave * 20,
                maxHealth: 100 + gameState.wave * 20,
                speed: CONFIG.zombieSpeed + gameState.wave * 0.05,
                element: null,
                attacking: false
            };
            
            const zombieElement = document.createElement('div');
            zombieElement.className = 'zombie';
            zombieElement.style.left = x + 'px';
            zombieElement.style.top = zombie.y + 'px';
            zombieElement.dataset.zombieId = zombie.id;
            
            zombie.element = zombieElement;
            gameBoard.appendChild(zombieElement);
            gameState.zombies.push(zombie);
        }

        // 植物射击
        function plantShoot(plant) {
            if (!gameState.isRunning || gameState.isPaused) return;
            if (!PLANTS[plant.type].canShoot) return;
            
            const hasZombieInRow = gameState.zombies.some(z => z.row === plant.row && z.x > plant.x);
            if (!hasZombieInRow) return;
            
            const now = Date.now();
            if (now - plant.lastShootTime < CONFIG.plantShootInterval) return;
            
            plant.lastShootTime = now;
            
            const bullet = {
                id: Date.now() + Math.random(),
                row: plant.row,
                x: plant.x + 40,
                y: plant.y + 22,
                damage: CONFIG.bulletDamage,
                speed: CONFIG.bulletSpeed,
                element: null
            };
            
            const bulletElement = document.createElement('div');
            bulletElement.className = 'bullet';
            bulletElement.style.left = bullet.x + 'px';
            bulletElement.style.top = bullet.y + 'px';
            bulletElement.dataset.bulletId = bullet.id;
            
            bullet.element = bulletElement;
            gameBoard.appendChild(bulletElement);
            gameState.bullets.push(bullet);
        }

        // 游戏主循环
        function gameLoop() {
            if (!gameState.isRunning || gameState.isPaused) {
                gameState.animationFrameId = requestAnimationFrame(gameLoop);
                return;
            }
            
            for (const plant of gameState.plants) {
                plantShoot(plant);
                sunflowerProduceSun(plant);
            }
            
            for (let i = gameState.bullets.length - 1; i >= 0; i--) {
                const bullet = gameState.bullets[i];
                bullet.x += bullet.speed;
                bullet.element.style.left = bullet.x + 'px';
                
                let hitZombie = null;
                for (const zombie of gameState.zombies) {
                    if (zombie.row === bullet.row &&
                        Math.abs(bullet.x - zombie.x) < 30 &&
                        Math.abs(bullet.y - zombie.y) < 40) {
                        hitZombie = zombie;
                        break;
                    }
                }
                
                if (hitZombie) {
                    hitZombie.health -= bullet.damage;
                    hitZombie.element.classList.add('damage-flash');
                    setTimeout(() => hitZombie.element.classList.remove('damage-flash'), 100);
                    
                    if (hitZombie.health <= 0) {
                        removeZombie(hitZombie);
                        gameState.kills++;
                        updateUI();
                    }
                    
                    removeBullet(bullet);
                    gameState.bullets.splice(i, 1);
                    continue;
                }
                
                if (bullet.x > CONFIG.cols * CONFIG.cellWidth + 50) {
                    removeBullet(bullet);
                    gameState.bullets.splice(i, 1);
                }
            }
            
            for (let i = gameState.zombies.length - 1; i >= 0; i--) {
                const zombie = gameState.zombies[i];
                
                let blockedPlant = null;
                for (const plant of gameState.plants) {
                    if (plant.row === zombie.row &&
                        Math.abs(zombie.x - plant.x) < 50) {
                        blockedPlant = plant;
                        break;
                    }
                }
                
                if (blockedPlant) {
                    if (!zombie.attacking) {
                        zombie.attacking = true;
                    }
                    blockedPlant.health -= 1;
                    
                    if (blockedPlant.health <= 0) {
                        removePlant(blockedPlant);
                        zombie.attacking = false;
                    }
                } else {
                    zombie.x -= zombie.speed;
                    zombie.element.style.left = zombie.x + 'px';
                }
                
                if (zombie.x < 0) {
                    gameOver();
                    return;
                }
            }
            
            gameState.animationFrameId = requestAnimationFrame(gameLoop);
        }

        // 移除植物
        function removePlant(plant) {
            const index = gameState.plants.indexOf(plant);
            if (index > -1) {
                gameState.plants.splice(index, 1);
                
                const cells = document.querySelectorAll('.cell');
                for (const cell of cells) {
                    if (parseInt(cell.dataset.row) === plant.row &&
                        parseInt(cell.dataset.col) === plant.col) {
                        cell.classList.remove('occupied');
                        break;
                    }
                }
                
                if (plant.element && plant.element.parentNode) {
                    plant.element.remove();
                }
            }
        }

        // 移除僵尸
        function removeZombie(zombie) {
            const index = gameState.zombies.indexOf(zombie);
            if (index > -1) {
                gameState.zombies.splice(index, 1);
                if (zombie.element && zombie.element.parentNode) {
                    zombie.element.remove();
                }
            }
        }

        // 移除子弹
        function removeBullet(bullet) {
            if (bullet.element && bullet.element.parentNode) {
                bullet.element.remove();
            }
        }

        // 增加波次
        function increaseWave() {
            if (!gameState.isRunning || gameState.isPaused) return;
            gameState.wave++;
            updateUI();
        }

        // 游戏结束
        function gameOver() {
            gameState.isRunning = false;
            
            for (const interval of gameState.intervals) {
                clearInterval(interval);
            }
            gameState.intervals = [];
            
            if (gameState.animationFrameId) {
                cancelAnimationFrame(gameState.animationFrameId);
            }
            
            finalWaveElement.textContent = gameState.wave;
            finalKillsElement.textContent = gameState.kills;
            gameOverElement.style.display = 'block';
        }

        // 重置游戏
        function resetGame() {
            gameState.isRunning = false;
            gameState.isPaused = false;
            
            for (const interval of gameState.intervals) {
                clearInterval(interval);
            }
            gameState.intervals = [];
            
            if (gameState.animationFrameId) {
                cancelAnimationFrame(gameState.animationFrameId);
            }
            
            gameState = {
                isRunning: false,
                isPaused: false,
                sunCount: CONFIG.initialSun,
                wave: 1,
                kills: 0,
                selectedPlant: 'peashooter',
                plants: [],
                zombies: [],
                bullets: [],
                sunDrops: [],
                intervals: [],
                animationFrameId: null
            };
            
            plantCards.forEach(card => {
                card.classList.remove('selected');
            });
            plantCards[0].classList.add('selected');
            
            initializeBoard();
            updateUI();
            
            gameOverElement.style.display = 'none';
            startBtn.style.display = 'block';
            pauseBtn.style.display = 'none';
        }

        // 开始游戏
        startBtn.addEventListener('click', () => {
            if (gameState.isRunning) return;
            
            gameState.isRunning = true;
            gameState.isPaused = false;
            
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'block';
            pauseBtn.textContent = '暂停';
            
            const sunInterval = setInterval(spawnSunDrop, CONFIG.sunDropInterval);
            gameState.intervals.push(sunInterval);
            
            const zombieInterval = setInterval(() => {
                const zombiesToSpawn = Math.min(1 + Math.floor(gameState.wave / 3), 3);
                for (let i = 0; i < zombiesToSpawn; i++) {
                    setTimeout(() => spawnZombie(), i * 1000);
                }
            }, CONFIG.zombieSpawnInterval);
            gameState.intervals.push(zombieInterval);
            
            const waveInterval = setInterval(increaseWave, 30000);
            gameState.intervals.push(waveInterval);
            
            gameLoop();
        });

        // 暂停/继续
        pauseBtn.addEventListener('click', () => {
            gameState.isPaused = !gameState.isPaused;
            pauseBtn.textContent = gameState.isPaused ? '继续' : '暂停';
        });

        // 重新开始
        restartBtn.addEventListener('click', resetGame);

        // 初始化
        initializeBoard();
        updateUI();
    </script>
</body>
</html>
