## 已实现的功能模块

### 1. 迭代（Sprint）管理模块
- **迭代列表展示**：显示迭代名称、状态标签、周期时间、目标描述
- **创建/编辑迭代**：支持设置名称、目标、起止时间范围
- **状态流转**：支持开启、暂停、恢复、结束四种操作，根据当前状态动态显示可用操作
- **任务管理**：点击迭代卡片查看详情，支持将任务移出迭代
- **迭代统计**：任务总数、已完成数、剩余数、故事点总计、完成进度条

### 2. 可视化看板模块
- **看板视图**：经典敏捷看板，按状态分列（待处理、进行中、已完成、已关闭）
- **列表视图**：表格形式展示所有任务，支持分页
- **视图切换**：顶部 Radio 按钮快速切换两种视图
- **任务卡片**：展示标题、类型标签、优先级标签、故事点、经办人、截止日期（过期标红）

### 3. 产品待办池模块
- **待办列表**：表格展示所有待办需求，支持拖拽排序指示
- **批量操作**：选中多条记录后可批量更新状态或删除
- **拉入迭代**：快速将待办项添加到活跃或规划中的迭代
- **转换为任务**：一键将待办项转换为正式任务

### 4. 版本管理模块
- **版本卡片**：展示版本名称、类型（迭代版本/正式版本）、状态、发布日期、完成进度
- **创建/编辑版本**：支持设置名称、类型、发布日期、描述
- **版本详情**：点击卡片查看版本描述和关联任务列表

## 技术特点
- 使用 Tabs 组件切换四个功能模块，界面清晰
- 所有 API 调用使用已有的 `sprintApi`, `backlogApi`, `versionApi`, `taskApi`, `userApi`
- 完整的 TypeScript 类型定义，类型安全
- 代码风格与现有页面保持一致
- 通过 ESLint 代码检查，无错误和警告

